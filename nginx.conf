server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses. Without this the main script went out at full
    # size (~350 KB instead of ~110 KB) and so did Pyodide's 9 MB WebAssembly.
    # woff2, png and zip are already compressed and are left alone.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/wasm image/svg+xml font/ttf;

    # React/Vite SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Code sandbox worker and the self-hosted Pyodide runtime. The worker
    # evaluates student code, so it gets its own CSP (eval and WebAssembly
    # allowed, network limited to this origin) instead of the app's. `^~` keeps
    # the regex cache rule below from claiming sandbox-worker.js: its name is
    # not content-hashed, so it must not be cached as immutable. `types`
    # replaces the MIME map for this block; older mime.types files lack .mjs,
    # and module scripts are refused without a JavaScript type.
    location ^~ /sandbox/ {
        types {
            text/javascript js mjs;
            application/wasm wasm;
            application/json json;
            application/zip zip;
        }
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; connect-src 'self'; worker-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Vite's build output has a content hash in every file name, so a new
    # deploy always gets new URLs and these can be cached for good.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Other static files (logo, favicon, Excalidraw fonts) keep their names
    # across deploys, so browsers must be able to pick up a changed file.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
